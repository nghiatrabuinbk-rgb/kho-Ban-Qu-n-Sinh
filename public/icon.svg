  <line x1="168" y1="240" x2="168" y2="288" stroke="#0F4C5C" stroke-width="4" />
  <line x1="144" y1="264" x2="192" y2="264" stroke="#0F4C5C" stroke-width="4" />
  
  <!-- Window Grid Right -->
  <rect x="320" y="240" width="48" height="48" rx="6" fill="#F8FAFC" />
  <line x1="344" y1="240" x2="344" y2="288" stroke="#0F4C5C" stroke-width="4" />
  <line x1="320" y1="264" x2="368" y2="264" stroke="#0F4C5C" stroke-width="4" />

